<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Chang Kee AR Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍤 Old Chang Kee Blind Box</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#collection">My Snacks</a></li>
                <li><a href="#profile">Profile</a></li>
            </ul>
        </nav>
    </header>

    <section id="collection">
        <h2>My Snack Collection</h2>
        <div class="collection-grid">
            <!-- Example snack collectibles -->
            <div class="collectible">
                <img src="https://www.oldchangkee.com/images/img-main-prod-traditional.jpg" alt="Curry Puff">
                <p>Curry Puff</p>
            </div>
            <div class="collectible">
                <img src="https://www.oldchangkee.com/images/img-main-prod-seafood.jpg" alt="Fish Ball">
                <p>Fish Ball</p>
            </div>
            <div class="collectible">
                <img src="https://www.oldchangkee.com/images/img-main-prod-chicken.jpg" alt="Chicken Wing">
                <p>Chicken Wing</p>
            </div>
            <!-- More collectibles dynamically added later -->
        </div>
    </section>

    <section id="profile">
        <h2>Profile & Login</h2>
        <form id="loginForm">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="main-btn">Login</button>
        </form>
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </section>

    <footer>
        <p>© 2025 Old Chang Kee Blind Box</p>
    </footer>
</body>
</html>
