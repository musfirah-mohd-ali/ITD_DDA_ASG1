<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Old Chang Kee Blind Box</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>

<header>
    <h1>My Profile</h1>
    <nav>
        <ul>
            <li><a href="/Assets/Website/index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>
</header>

<section id="user-info">
    <h2>👋 Hello, Snack Collector!</h2>
    
    <div class="profile-card">
        <div class="profile-avatar">
            <img src="Assets/profile_placeholder.png" alt="User Avatar">
        </div>
        
        <div class="profile-details">
            <h3>Puff Enthusiast</h3>
            <p><strong>Email:</strong> user@snackcollector.com</p>
            <p><strong>Joined:</strong> January 2025</p>
        </div>
        
        <button class="main-btn logout-btn">Logout</button>
    </div>
</section>

<section id="stats">
    <h2>🏆 Collection Progress</h2>

    <div class="stats-grid">
        <div class="stat-box">
            <h3>4 / 12</h3>
            <p>Unique Snacks Collected</p>
        </div>
        <div class="stat-box">
            <h3>15</h3>
            <p>Total Boxes Opened</p>
        </div>
        <div class="stat-box">
            <h3>2</h3>
            <p>Rare Items Found</p>
        </div>
    </div>

    <a href="mysnacks.html" class="main-btn">View My Collection</a>
</section>


<footer>
    <p>© 2025 Old Chang Kee Blind Box</p>
</footer>

</body>
</html>
