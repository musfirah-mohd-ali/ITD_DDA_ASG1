<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Old Chang Kee Blind Box</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Welcome Back!</h1>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="mysnacks.html">My Snacks</a></li>
            <li><a href="profile.html">Profile</a></li>
        </ul>
    </nav>
</header>

<section id="login-section" class="centered-form">
    <h2>🔑 Account Access</h2>

    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="main-btn">Login Now</button>
    </form>

    <p class="signup-link">Don't have an account? <a href="#">Sign up here</a></p>
    <p class="forgot-link"><a href="#">Forgot Password?</a></p>
</section>

<footer>
    <p>© 2025 Old Chang Kee Blind Box</p>
</footer>

</body>
</html>
