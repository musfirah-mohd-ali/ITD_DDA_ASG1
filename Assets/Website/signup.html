<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Old Chang Kee Blind Box</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="register.js" defer></script>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="/Assets/Pictures/ockLogo.png" alt="Old Chang Kee Logo" class="header-logo"> 
        <span class="logo-text">Blind Box</span>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
        </ul>
    </nav>
</header>

<section id="signup-section" class="centered-form">
    <h2>🤝 Create Account</h2>

    <form id="signupForm">
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Create a password" required>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="main-btn">Sign Up Now</button>
    </form>

    <p class="signup-link">Already have an account? <a href="login.html">Log in here</a></p>
    
</section>

<footer>
    <p>© 2025 Old Chang Kee Blind Box</p>
</footer>

</body>
</html>
